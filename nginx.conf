server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Cache policy is the whole reason this file exists as a file instead of an echo in the
  # Dockerfile. Without it the app served a stale build until someone pressed Ctrl+F5.
  #
  # Two documents must always be revalidated:
  #
  #   index.html — Vite fingerprints every asset, so index.html is the only document that
  #   names the current build. Served from cache, it points the browser at the PREVIOUS
  #   bundle, and the app is old no matter how new the assets on disk are. With no
  #   Cache-Control at all (the earlier state) browsers fall back to heuristic caching and
  #   keep it for a while on their own.
  #
  #   sw.js — this matters more. The PWA registers with registerType 'autoUpdate', and a
  #   service worker can only discover a new build by fetching this script. Cached for
  #   hours at the edge or in the browser, the update check reads a stale copy and finds
  #   nothing, so the app cannot update itself even though it is built to.
  #
  # "no-cache" does not mean "do not store" — it means revalidate before use. With ETag and
  # Last-Modified already present, the common case is a cheap 304, not a re-download.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Never serve HTML as a response for the web app manifest or service worker.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Fingerprinted by the build: the filename changes whenever the bytes do, so a cached copy
  # can never be the wrong one. Cache it as long as anything is willing to.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback. The final argument is a URI, so nginx issues an internal redirect and
  # location matching runs again — which is how the fallback picks up the no-cache header
  # from the `= /index.html` block above rather than being served bare.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
